<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1a14"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(196,149,106,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <text x="800" y="510" font-family="Georgia, serif" font-size="64" fill="rgba(196,149,106,0.5)" text-anchor="middle" font-style="italic">Desktop screen placeholder</text>
  <text x="800" y="570" font-family="monospace" font-size="22" fill="rgba(196,149,106,0.3)" text-anchor="middle" letter-spacing="4">1600 × 1000</text>
</svg>
