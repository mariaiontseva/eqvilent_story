<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mitoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1608"/>
      <stop offset="0.55" stop-color="#1c0e04"/>
      <stop offset="1" stop-color="#120803"/>
    </linearGradient>
    <radialGradient id="mitoGlow" cx="0.72" cy="0.5" r="0.6">
      <stop offset="0" stop-color="rgba(255,140,60,0.35)"/>
      <stop offset="0.5" stop-color="rgba(255,120,40,0.12)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="mitoGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,140,60,0.07)" stroke-width="1"/>
    </pattern>
    <linearGradient id="orangeStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="1" stop-color="#e86a1c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#mitoBg)"/>
  <rect width="1600" height="1000" fill="url(#mitoGrid)"/>
  <circle cx="1180" cy="500" r="500" fill="url(#mitoGlow)"/>

  <!-- Stylized molecule rings on the right -->
  <g transform="translate(1180, 500)" fill="none">
    <ellipse cx="0" cy="0" rx="240" ry="120" transform="rotate(-25)" stroke="url(#orangeStroke)" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="240" ry="120" transform="rotate(25)" stroke="url(#orangeStroke)" stroke-width="3" opacity="0.75"/>
    <ellipse cx="0" cy="0" rx="240" ry="120" transform="rotate(75)" stroke="url(#orangeStroke)" stroke-width="3" opacity="0.45"/>
    <circle cx="0" cy="0" r="16" fill="#ff8a30"/>
    <circle cx="185" cy="-55" r="9" fill="#ffa050" opacity="0.85"/>
    <circle cx="-165" cy="70" r="11" fill="#ff9040" opacity="0.75"/>
    <circle cx="90" cy="145" r="7" fill="#ffb070" opacity="0.7"/>
    <circle cx="-95" cy="-120" r="8" fill="#ffa050" opacity="0.6"/>
    <circle cx="200" cy="90" r="6" fill="#ffb070" opacity="0.55"/>
  </g>

  <!-- Left side typography -->
  <g transform="translate(100, 400)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="20"
          fill="#ff9040" letter-spacing="6">HEALTH · WELLNESS · SUPPLEMENTS</text>

    <text x="0" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="160"
          fill="#fff2e0" font-style="italic" font-weight="300" letter-spacing="-3">Mitocholine</text>

    <text x="0" y="210" font-family="Georgia, serif" font-size="32"
          fill="rgba(255,220,180,0.7)" font-style="italic" font-weight="300">powering mitochondrial health</text>

    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="none" stroke="rgba(255,140,60,0.55)" stroke-width="1"/>
      <text x="85" y="25" font-family="'Courier New', monospace" font-size="13"
            fill="rgba(255,220,180,0.85)" text-anchor="middle" letter-spacing="2">LANDING PAGE</text>

      <rect x="190" y="0" width="170" height="38" rx="19" fill="none" stroke="rgba(255,140,60,0.55)" stroke-width="1"/>
      <text x="275" y="25" font-family="'Courier New', monospace" font-size="13"
            fill="rgba(255,220,180,0.85)" text-anchor="middle" letter-spacing="2">STRATEGY</text>

      <rect x="380" y="0" width="170" height="38" rx="19" fill="none" stroke="rgba(255,140,60,0.55)" stroke-width="1"/>
      <text x="465" y="25" font-family="'Courier New', monospace" font-size="13"
            fill="rgba(255,220,180,0.85)" text-anchor="middle" letter-spacing="2">MATERIALS</text>
    </g>
  </g>
</svg>
